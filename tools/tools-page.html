<style>
#yt-tools-root, #yt-tools-root *{box-sizing:border-box;user-select:text !important;-webkit-user-select:text !important;}
#yt-tools-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f7f8;color:#1c1c1e;max-width:1120px;margin:0 auto;padding:28px 16px 60px;line-height:1.5;}
#yt-tools-root .yt-hero{text-align:center;padding:26px 10px 8px;}
#yt-tools-root .yt-hero h1{font-size:clamp(26px,4.5vw,42px);font-weight:800;margin:0 0 10px;letter-spacing:-.5px;}
#yt-tools-root .yt-hero h1 .yt-red{color:#e62117;}
#yt-tools-root .yt-hero p{color:#6b6b70;font-size:15px;margin:0 0 20px;}
#yt-tools-root .yt-search{max-width:540px;margin:0 auto 18px;position:relative;}
#yt-tools-root .yt-search input{width:100%;padding:13px 18px 13px 44px;border:1px solid #e2e2e6;border-radius:999px;font-size:15px;background:#fff;outline:none;}
#yt-tools-root .yt-search input:focus{border-color:#e62117;box-shadow:0 0 0 3px rgba(230,33,23,.12);}
#yt-tools-root .yt-search .yt-sic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;color:#999;}
#yt-tools-root .yt-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px;}
#yt-tools-root .yt-pill{border:1px solid #e2e2e6;background:#fff;border-radius:999px;padding:8px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:#3a3a3e;transition:all .15s;}
#yt-tools-root .yt-pill:hover{border-color:#e62117;color:#e62117;}
#yt-tools-root .yt-pill.yt-on{background:#e62117;border-color:#e62117;color:#fff;}
#yt-tools-root .yt-count{text-align:center;color:#8a8a90;font-size:13px;margin-bottom:14px;}
#yt-tools-root .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
#yt-tools-root .yt-card{background:#fff;border:1px solid #ececef;border-radius:14px;padding:20px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;}
#yt-tools-root .yt-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08);border-color:#e62117;}
#yt-tools-root .yt-ico{width:46px;height:46px;border-radius:12px;background:#fdeceb;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;}
#yt-tools-root .yt-card h3{margin:0 0 6px;font-size:15px;font-weight:700;}
#yt-tools-root .yt-card p{margin:0;font-size:13px;color:#8a8a90;padding-right:20px;}
#yt-tools-root .yt-card .yt-arrow{position:absolute;right:16px;bottom:18px;color:#c9c9cf;font-size:18px;font-weight:700;}
#yt-tools-root .yt-card:hover .yt-arrow{color:#e62117;}
/* modal */
#yt-tools-root .yt-ov{position:fixed;inset:0;background:rgba(15,15,20,.55);z-index:999999;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;}
#yt-tools-root .yt-ov.yt-show{display:flex;}
#yt-tools-root .yt-md{background:#fff;border-radius:16px;width:100%;max-width:660px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.25);animation:ytpop .18s ease-out;}
@keyframes ytpop{from{transform:translateY(14px) scale(.98);opacity:.4;}to{transform:none;opacity:1;}}
#yt-tools-root .yt-mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #f0f0f3;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2;}
#yt-tools-root .yt-mh h2{margin:0;font-size:18px;color:#e62117;font-weight:800;}
#yt-tools-root .yt-x{border:none;background:#f4f4f6;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:#555;flex-shrink:0;}
#yt-tools-root .yt-x:hover{background:#e62117;color:#fff;}
#yt-tools-root .yt-mb{padding:22px;overflow-y:auto;}
#yt-tools-root .yt-lab{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:#3a3a3e;}
#yt-tools-root .yt-lab:first-child{margin-top:0;}
#yt-tools-root .yt-in,#yt-tools-root .yt-ta,#yt-tools-root select.yt-in{width:100%;padding:11px 13px;border:1px solid #dcdce0;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#1c1c1e;}
#yt-tools-root .yt-in:focus,#yt-tools-root .yt-ta:focus{outline:none;border-color:#e62117;box-shadow:0 0 0 3px rgba(230,33,23,.1);}
#yt-tools-root .yt-ta{min-height:110px;resize:vertical;}
#yt-tools-root .yt-row{display:flex;gap:10px;flex-wrap:wrap;}
#yt-tools-root .yt-row>*{flex:1;min-width:120px;}
#yt-tools-root .yt-btn{display:inline-block;background:#e62117;color:#fff;border:none;border-radius:9px;padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:14px;transition:background .15s;}
#yt-tools-root .yt-btn:hover{background:#c81a12;}
#yt-tools-root .yt-btn:disabled{background:#c9c9cf;cursor:not-allowed;}
#yt-tools-root .yt-ghost{display:inline-block;background:#fff;color:#e62117;border:1.5px solid #e62117;border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;margin:8px 8px 0 0;}
#yt-tools-root .yt-ghost:hover{background:#fdeceb;}
#yt-tools-root .yt-res{background:#f6f6f8;border:1px solid #ececef;border-radius:10px;padding:14px;margin-top:16px;font-size:14px;word-break:break-word;}
#yt-tools-root .yt-res pre{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:13px;margin:0;max-height:320px;overflow:auto;}
#yt-tools-root .yt-note{font-size:12.5px;color:#8a8a90;margin-top:10px;}
#yt-tools-root .yt-chk{display:flex;align-items:flex-start;gap:9px;margin:8px 0;font-size:14px;cursor:pointer;}
#yt-tools-root .yt-chk input{margin-top:3px;accent-color:#e62117;width:16px;height:16px;flex-shrink:0;}
#yt-tools-root .yt-bar{height:12px;background:#ececef;border-radius:99px;overflow:hidden;margin:10px 0;}
#yt-tools-root .yt-bar>div{height:100%;background:linear-gradient(90deg,#e62117,#ff6b5e);border-radius:99px;transition:width .5s;}
#yt-tools-root .yt-score{font-size:34px;font-weight:800;color:#e62117;}
#yt-tools-root .yt-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;}
#yt-tools-root .yt-tbl td,#yt-tools-root .yt-tbl th{border-bottom:1px solid #eee;padding:8px 6px;text-align:left;}
#yt-tools-root .yt-tbl th{color:#8a8a90;font-weight:600;font-size:12px;text-transform:uppercase;}
#yt-tools-root .yt-ok{color:#1a9e54;font-weight:700;}
#yt-tools-root .yt-bad{color:#e62117;font-weight:700;}
#yt-tools-root .yt-thumb{max-width:100%;border-radius:8px;border:1px solid #eee;margin:6px 0;}
#yt-tools-root .yt-phone{width:270px;max-width:80%;margin:0 auto;border:10px solid #111;border-radius:32px;overflow:hidden;aspect-ratio:9/16;background:#000;}
#yt-tools-root .yt-phone iframe{width:100%;height:100%;border:0;}
#yt-tools-root .yt-vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:10px;}
#yt-tools-root .yt-vid iframe{width:100%;height:100%;border:0;}
#yt-tools-root .yt-copy{float:right;font-size:12px;}
#yt-tools-root .yt-tagchip{display:inline-block;background:#fdeceb;color:#c81a12;border-radius:99px;padding:4px 12px;font-size:12.5px;margin:3px;font-weight:600;}
#yt-tools-root .yt-foot{text-align:center;color:#a9a9b0;font-size:12.5px;margin-top:36px;}
#yt-tools-root input[type=file].yt-in{padding:9px;}
#yt-tools-root input[type=range]{width:100%;accent-color:#e62117;}
#yt-tools-root input[type=color].yt-in{height:44px;padding:4px;cursor:pointer;}
@media(max-width:560px){#yt-tools-root .yt-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}#yt-tools-root .yt-card{padding:14px;}#yt-tools-root .yt-card p{display:none;}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<div id="yt-tools-root">
  <div class="yt-hero">
    <h1>Make more. <span class="yt-red">Switch tabs less.</span></h1>
    <p>42 free tools that run entirely in your browser. No sign-up, no uploads to any server — your files never leave your device.</p>
    <div class="yt-search"><span class="yt-sic">🔍</span><input id="yt-q" type="text" placeholder="Search tools… e.g. thumbnail, pdf, qr" autocomplete="off"></div>
  </div>
  <div class="yt-pills" id="yt-pills"></div>
  <div class="yt-count" id="yt-count"></div>
  <div class="yt-grid" id="yt-grid"></div>
  <div class="yt-foot">All tools work 100% client-side. Nothing is uploaded anywhere.</div>
  <div class="yt-ov" id="yt-ov">
    <div class="yt-md">
      <div class="yt-mh"><h2 id="yt-mt"></h2><button class="yt-x" id="yt-mx" aria-label="Close">✕</button></div>
      <div class="yt-mb" id="yt-mb"></div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
/* ============ helpers ============ */
function $(s,r){return (r||document).querySelector(s);}
function $$ (s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function lab(t){return '<label class="yt-lab">'+t+'</label>';}
function inp(id,ph,val,type){return '<input class="yt-in" id="'+id+'" type="'+(type||"text")+'" placeholder="'+esc(ph||"")+'" value="'+esc(val==null?"":val)+'">';}
function ta(id,ph,rows){return '<textarea class="yt-ta" id="'+id+'" rows="'+(rows||4)+'" placeholder="'+esc(ph||"")+'"></textarea>';}
function btn(t,fn,id){return '<button class="yt-btn"'+(id?' id="'+id+'"':'')+'>'+t+'</button>';}
function ghost(t,fn){return '<button class="yt-ghost" data-g="'+t+'">'+t+'</button>';}
function note(t){return '<div class="yt-note">'+t+'</div>';}
function resBox(id){return '<div class="yt-res" id="'+id+'" style="display:none"></div>';}
function showRes(id,html){var e=$('#'+id);if(e){e.style.display='block';e.innerHTML=html;}}
function copyTxt(t,bt){
  function done(){if(bt){var o=bt.getAttribute('data-o')||bt.textContent;bt.setAttribute('data-o',o);bt.textContent='Copied ✓';setTimeout(function(){bt.textContent=o;},1400);}}
  function fb(){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');done();}catch(e){}x.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(fb);}else{fb();}
}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);}
function fmtB(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file);var i=new Image();i.onload=function(){URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});}
function ytId(u){u=String(u||'').trim();var m=u.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|live\/|embed\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(u))return u;return null;}
function ytThumb(id,q){return 'https://i.ytimg.com/vi/'+id+'/'+q+'.jpg';}
/* ============ modal / grid ============ */
var ov=$('#yt-ov'),mt=$('#yt-mt'),mb=$('#yt-mb');
function openTool(t){mt.textContent=t.name;mb.innerHTML='';mb.onkeydown=null;try{t.build(mb);}catch(e){mb.innerHTML='<div class="yt-res">Error loading tool: '+esc(e.message)+'</div>';}ov.classList.add('yt-show');document.body.style.overflow='hidden';}
function closeTool(){ov.classList.remove('yt-show');document.body.style.overflow='';mb.innerHTML='';mb.onkeydown=null;}
$('#yt-mx').addEventListener('click',closeTool);
ov.addEventListener('click',function(e){if(e.target===ov)closeTool();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('yt-show'))closeTool();});
var CATS=[['all','All'],['youtube','YouTube'],['media','Media'],['docs','Documents'],['prod','Productivity'],['fin','Finance'],['web','Web & SEO']];
var activeCat='all';
function renderPills(){var p=$('#yt-pills');p.innerHTML='';CATS.forEach(function(c){var b=document.createElement('button');b.className='yt-pill'+(c[0]===activeCat?' yt-on':'');b.textContent=c[1];b.onclick=function(){activeCat=c[0];renderPills();renderGrid();};p.appendChild(b);});}
function renderGrid(){
  var q=$('#yt-q').value.toLowerCase().trim(),g=$('#yt-grid');g.innerHTML='';
  var list=TOOLS.filter(function(t){return (activeCat==='all'||t.cat===activeCat)&&((t.name+' '+t.tag+' '+t.cat).toLowerCase().indexOf(q)>=0);});
  $('#yt-count').textContent=list.length+' tool'+(list.length===1?'':'s');
  list.forEach(function(t){
    var d=document.createElement('div');d.className='yt-card';
    d.innerHTML='<div class="yt-ico">'+t.icon+'</div><h3>'+esc(t.name)+'</h3><p>'+esc(t.tag)+'</p><span class="yt-arrow">→</span>';
    d.onclick=function(){openTool(t);};g.appendChild(d);
  });
  if(!list.length)g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">No tools match your search.</div>';
}
/* ================= TOOLS ================= */
const TOOLS=[
/* ---------- YOUTUBE ---------- */
{id:'yt-tags',cat:'youtube',icon:'🏷️',name:'Tag Generator',tag:'SEO tags + hashtags for any video topic',build:function(b){
  b.innerHTML=lab('Video topic or title')+inp('tg-t','e.g. how to bake chocolate cake')+lab('Niche (optional)')+inp('tg-n','e.g. cooking')+btn('Generate Tags','','tg-go')+resBox('tg-r');
  $('#tg-go',b).onclick=function(){
    var topic=$('#tg-t',b).value.trim(),niche=$('#tg-n',b).value.trim().toLowerCase();
    if(!topic){showRes('tg-r','Please enter a topic first.');return;}
    var t=topic.toLowerCase().replace(/[^\w\s-]/g,'');
    var set=[];
    function add(s){s=s.trim();if(s&&set.indexOf(s)<0)set.push(s);}
    add(t);
    [t+' video',t+' tutorial','how to '+t,'best '+t,t+' 2026',t+' for beginners',t+' tips and tricks',t+' step by step',t+' full guide',t+' review',t+' explained',t+' must watch',t+' in hindi'].forEach(add);
    t.split(/\s+/).forEach(function(w){if(w.length>2)add(w);});
    if(niche){add(niche);add(t+' '+niche);}
    var tags=set.slice(0,30);
    var hw=t.split(/\s+/).filter(function(w){return w.length>2;}).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);});
    var hts=['#'+hw.join('')];hw.forEach(function(w){hts.push('#'+w);});
    showRes('tg-r','<b>'+tags.length+' tags</b> <span class="yt-note">('+tags.join(', ').length+'/500 chars)</span><br><br>'+
      tags.map(function(x){return '<span class="yt-tagchip">'+esc(x)+'</span>';}).join('')+
      '<br><br><b>Hashtags:</b><br>'+hts.map(function(x){return '<span class="yt-tagchip">'+esc(x)+'</span>';}).join('')+
      '<br><br><button class="yt-ghost" id="tg-cp">Copy Tags</button> <button class="yt-ghost" id="tg-cph">Copy Hashtags</button>');
    $('#tg-cp',b).onclick=function(){copyTxt(tags.join(', '),this);};
    $('#tg-cph',b).onclick=function(){copyTxt(hts.join(' '),this);};
  };
}},
{id:'yt-desc',cat:'youtube',icon:'📝',name:'Description Writer',tag:'Full video description template in seconds',build:function(b){
  b.innerHTML=lab('Video title')+inp('dw-title','e.g. How to Bake Chocolate Cake')+lab('Topic (1 line)')+inp('dw-topic','e.g. easy chocolate cake recipe')+lab('Channel name')+inp('dw-ch','e.g. My Kitchen')+lab('Links (one per line, optional)')+ta('dw-links','https://…',2)+btn('Write Description','','dw-go')+resBox('dw-r');
  $('#dw-go',b).onclick=function(){
    var title=$('#dw-title',b).value.trim()||'My New Video';
    var topic=$('#dw-topic',b).value.trim()||title;
    var ch=$('#dw-ch',b).value.trim()||'this channel';
    var links=$('#dw-links',b).value.trim().split('\n').filter(function(x){return x.trim();});
    var ht=topic.toLowerCase().split(/\s+/).filter(function(w){return w.length>2;}).slice(0,3).map(function(w){return '#'+w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');
    var d=title+'\n\n'+topic.charAt(0).toUpperCase()+topic.slice(1)+' — everything you need to know in one video. Watch till the end for the best tips!\n\n📌 In this video:\n• What '+topic+' is all about\n• Step-by-step walkthrough\n• Common mistakes to avoid\n• Pro tips you won\'t find elsewhere\n\n⏱ Chapters:\n0:00 Intro\n1:30 Getting started\n5:00 Main tutorial\n9:00 Final tips\n\n🔔 Subscribe to '+ch+' for more '+topic+' videos!\n\n🔗 Useful links:\n'+(links.length?links.map(function(l){return '• '+l.trim();}).join('\n'):'• (add your links here)')+'\n\n'+ht+' #youtube';
    showRes('dw-r','<pre>'+esc(d)+'</pre><br><button class="yt-ghost" id="dw-cp">Copy Description</button> <span class="yt-note">'+d.length+' characters</span>');
    $('#dw-cp',b).onclick=function(){copyTxt(d,this);};
  };
}},
{id:'yt-kw',cat:'youtube',icon:'💡',name:'Keyword Ideas',tag:'Long-tail keyword variations from a seed word',build:function(b){
  b.innerHTML=lab('Seed keyword')+inp('kw-s','e.g. weight loss')+btn('Get Ideas','','kw-go')+resBox('kw-r');
  $('#kw-go',b).onclick=function(){
    var s=$('#kw-s',b).value.trim().toLowerCase();if(!s){showRes('kw-r','Enter a seed keyword.');return;}
    var pre=['how to','best','top 10','top 5','what is','why','easy','quick','ultimate guide to','beginner guide to'];
    var post=['for beginners','2026','step by step','at home','for free','explained','tips','tricks','tutorial','review','vs','in hindi','full video','for students'];
    var out=[];
    pre.forEach(function(p){out.push(p+' '+s);});
    post.forEach(function(p){out.push(s+' '+p);});
    showRes('kw-r','<b>'+out.length+' keyword ideas</b><br><br>'+out.map(function(x){return '<span class="yt-tagchip">'+esc(x)+'</span>';}).join('')+'<br><br><button class="yt-ghost" id="kw-cp">Copy All</button>');
    $('#kw-cp',b).onclick=function(){copyTxt(out.join('\n'),this);};
  };
}},
{id:'yt-cap',cat:'youtube',icon:'💬',name:'Caption Ideator',tag:'Catchy caption ideas for your videos & posts',build:function(b){
  b.innerHTML=lab('Topic')+inp('ci-t','e.g. morning routine')+lab('Vibe')+'<select class="yt-in" id="ci-v"><option>Funny</option><option>Motivational</option><option>Question</option><option>Call to action</option></select>'+btn('Ideate','','ci-go')+resBox('ci-r');
  var bank={
    'Funny':['POV: {t} but make it chaotic 😅','Nobody:\nMe: {t} at 3am','{T} — expectation vs reality','Warning: {t} may cause extreme happiness'],
    'Motivational':['Small steps. Big {t} energy. 💪','Your future self will thank you for {t} today.','Discipline beats motivation. Especially with {t}.','Start where you are. {T} starts now.'],
    'Question':['What is your #1 tip for {t}? 👇','Hot take: {t} is overrated. Agree?','If you could only pick one {t} hack, what would it be?','Rate my {t} from 1 to 10 👀'],
    'Call to action':['Save this for later — you will need these {t} tips! 📌','Tag someone who needs to see this {t} 👇','Follow for daily {t} content 🔔','Comment YES if you are trying {t} this week!']
  };
  $('#ci-go',b).onclick=function(){
    var t=$('#ci-t',b).value.trim()||'this',v=$('#ci-v',b).value;
    var T=t.charAt(0).toUpperCase()+t.slice(1);
    var caps=bank[v].map(function(c){return c.replace(/\{t\}/g,t).replace(/\{T\}/g,T);});
    showRes('ci-r',caps.map(function(c,i){return '<div style="margin-bottom:10px;padding:10px;background:#fff;border-radius:8px;">'+esc(c).replace(/\n/g,'<br>')+'<br><button class="yt-ghost" data-ci="'+i+'">Copy</button></div>';}).join(''));
    $$('#ci-r [data-ci]',b).forEach(function(x){x.onclick=function(){copyTxt(caps[+x.getAttribute('data-ci')],x);};});
  };
}},
{id:'yt-thumb',cat:'youtube',icon:'🖼️',name:'Thumbnail Finder',tag:'Grab any YouTube thumbnail in all sizes',build:function(b){
  b.innerHTML=lab('YouTube video URL or ID')+inp('th-u','e.g. https://youtu.be/… or 11-char video ID')+btn('Find Thumbnails','','th-go')+resBox('th-r');
  $('#th-go',b).onclick=function(){
    var id=ytId($('#th-u',b).value);
    if(!id){showRes('th-r','Could not find a video ID. Paste a full YouTube URL or an 11-character ID.');return;}
    var qs=[['maxresdefault','HD 1280×720'],['sddefault','SD 640×480'],['hqdefault','HQ 480×360'],['mqdefault','MQ 320×180'],['default','Default 120×90']];
    var h='<b>Video ID:</b> '+esc(id);

{id:'m-cut',cat:'media',icon:'✂️',name:'MP3 Cutter',tag:'Trim audio precisely, export MP3',build:function(b){
  b.innerHTML=lab('Choose audio file')+'<input class="yt-in" type="file" id="mc-f" accept="audio/*">'+
   '<div class="yt-row"><div>'+lab('Start (sec)')+'<input class="yt-in" id="mc-s" type="number" step="0.1" min="0" value="0"></div><div>'+lab('End (sec)')+'<input class="yt-in" id="mc-e" type="number" step="0.1" min="0" value="30"></div></div>'+
   '<div class="yt-note" id="mc-d"></div>'+btn('Cut & Download MP3','','mc-go')+resBox('mc-r');
  var actx=null;
  function ctx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
  function f2i(f){var o=new Int16Array(f.length);for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*0x8000:s*0x7FFF;}return o;}
  $('#mc-f',b).onchange=function(){var f=this.files[0];if(!f)return;var a=new Audio();a.preload='metadata';a.onloadedmetadata=function(){$('#mc-d',b).textContent='Duration: '+a.duration.toFixed(1)+'s';$('#mc-e',b).value=Math.min(30,a.duration).toFixed(1);URL.revokeObjectURL(a.src);};a.onerror=function(){$('#mc-d',b).textContent='';};a.src=URL.createObjectURL(f);};
  $('#mc-go',b).onclick=function(){
    var f=$('#mc-f',b).files[0];if(!f){showRes('mc-r','Choose an audio file first.');return;}
    if(typeof lamejs==='undefined'){showRes('mc-r','MP3 encoder library failed to load — check your connection and retry.');return;}
    var s0=+$('#mc-s',b).value||0,s1=+$('#mc-e',b).value||0;
    if(s1<=s0){showRes('mc-r','End time must be greater than start time.');return;}
    showRes('mc-r','⏳ Decoding & encoding…');
    f.arrayBuffer().then(function(ab){return ctx().decodeAudioData(ab);}).then(function(buf){
      var sr=buf.sampleRate,ch=Math.min(2,buf.numberOfChannels);
      var a=Math.floor(s0*sr),e=Math.min(Math.floor(s1*sr),buf.length);
      if(e<=a){showRes('mc-r','That range is outside the audio.');return;}
      var L=f2i(buf.getChannelData(0).subarray(a,e));
      var R=ch>1?f2i(buf.getChannelData(1).subarray(a,e)):null;
      var enc=new lamejs.Mp3Encoder(ch,sr,128),out=[];
      for(var i=0;i<L.length;i+=1152){var d=enc.encodeBuffer(L.subarray(i,i+1152),R?R.subarray(i,i+1152):null);if(d.length)out.push(new Int8Array(d));}
      var fin=enc.flush();if(fin.length)out.push(new Int8Array(fin));

      showRes('mc-r','<span class="yt-ok">Done!</span> Trimmed '+((e-a)/sr).toFixed(1)+'s → MP3 downloaded (128 kbps).');

{id:'m-v2mp3',cat:'media',icon:'🎵',name:'Video to MP3',tag:'Extract audio from your video files',build:function(b){

  var actx=null;
  function ctx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
  function f2i(f){var o=new Int16Array(f.length);for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*0x8000:s*0x7FFF;}return o;}
  $('#vm-go',b).onclick=function(){
    var f=$('#vm-f',b).files[0];if(!f){showRes('vm-r','Choose a video file first.');return;}

    showRes('vm-r','⏳ Extracting audio… (large files take longer)');
    f.arrayBuffer().then(function(ab){return ctx().decodeAudioData(ab);}).then(function(buf){
      var sr=buf.sampleRate,ch=Math.min(2,buf.numberOfChannels);
      var L=f2i(buf.getChannelData(0)),R=ch>1?f2i(buf.getChannelData(1)):null;
      var enc=new lamejs.Mp3Encoder(ch,sr,128),out=[],i=0;
      (function step(){
        var n=Math.min(i+1152*24,L.length);
        for(;i<n;i+=1152){var d=enc.encodeBuffer(L.subarray(i,i+1152),R?R.subarray(i,i+1152):null);if(d.length)out.push(new Int8Array(d));}
        if(i<L.length){showRes('vm-r','⏳ Encoding… '+Math.round(i/L.length*100)+'%');setTimeout(step,0);}
        else{var e2=enc.flush();if(e2.length)out.push(new Int8Array(e2));dl(new Blob(out,{type:'audio/mpeg'}),'audio.mp3');showRes('vm-r','<span class="yt-ok">Done!</span> MP3 downloaded (128 kbps).');}
      })();
    }).catch(function(err){showRes('vm-r','Could not extract audio: '+esc((err&&err.message)||err)+'. Try an MP4 file.');});
  };
}},

  function hx2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return [Math.round(h),Math.round(s*100),Math.round(l*100)];}

     '<tr><td><b>HSL</b></td><td><code>hsl('+hsl[0]+', '+hsl[1]+'%, '+hsl[2]+'%)</code> <button class="yt-ghost" data-c="hsl('+hsl[0]+', '+hsl[1]+'%, '+hsl[2]+'%)">Copy</button></td></tr></table>');
    $$('#cc-r2 [data-c]',b).forEach(function(x){x.onclick=function(){copyTxt(x.getAttribute('data-c'),x);};});

{id:'p-pass',cat:'prod',icon:'🔐',name:'Password Generator',tag:'Strong random passwords + strength meter',build:function(b){
  b.innerHTML=lab('Length: <span id="pg-lv">16</span>')+'<input type="range" id="pg-l" min="6" max="64" value="16">'+
   '<label class="yt-chk"><input type="checkbox" id="pg-u" checked> Uppercase (A-Z)</label>'+
   '<label class="yt-chk"><input type="checkbox" id="pg-lo" checked> Lowercase (a-z)</label>'+
   '<label class="yt-chk"><input type="checkbox" id="pg-d" checked> Digits (0-9)</label>'+
   '<label class="yt-chk"><input type="checkbox" id="pg-s" checked> Symbols (!@#…)</label>'+
   '<label class="yt-chk"><input type="checkbox" id="pg-a"> Exclude ambiguous (0 O 1 l I)</label>'+
   btn('Generate','','pg-go')+resBox('pg-r');
  $('#pg-l',b).oninput=function(){$('#pg-lv',b).textContent=this.value;};
  $('#pg-go',b).onclick=function(){
    var len=+$('#pg-l',b).value,pool='';
    if($('#pg-u',b).checked)pool+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if($('#pg-lo',b).checked)pool+='abcdefghijklmnopqrstuvwxyz';
    if($('#pg-d',b).checked)pool+='0123456789';
    if($('#pg-s',b).checked)pool+='!@#$%^&*()-_=+[]{};:,.<>?';
    if($('#pg-a',b).checked)pool=pool.replace(/[0O1lI]/g,'');
    if(!pool){showRes('pg-r','Select at least one character set.');return;}
    var rnd=new Uint32Array(len);crypto.getRandomValues(rnd);var pw='';
    for(var i=0;i<len;i++)pw+=pool[rnd[i]%pool.length];
    var ent=Math.log2(pool.length)*len;
    var s=ent>90?'Very strong 💪':ent>60?'Strong 👍':ent>40?'Medium 🙂':'Weak ⚠️';
    showRes('pg-r','<pre style="font-size:17px;">'+esc(pw)+'</pre><div class="yt-note">Entropy: '+Math.round(ent)+' bits — '+s+'</div><br><button class="yt-ghost" id="pg-cp">Copy Password</button>');
    $('#pg-cp',b).onclick=function(){copyTxt(pw,this);};
  };
}},
{id:'p-unit',cat:'prod',icon:'📏',name:'Unit Converter',tag:'Length, weight, temp, data & more',build:function(b){
  var U={
    'Length':{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,yd:0.9144,ft:0.3048,in:0.0254},
    'Weight':{kg:1,g:0.001,lb:0.453592,oz:0.0283495},
    'Data':{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776},
    'Speed':{'m/s':1,'km/h':0.277778,mph:0.44704},
    'Time':{sec:1,min:60,hr:3600,day:86400}
  };
  b.innerHTML=lab('Category')+'<select class="yt-in" id="uc-c">'+Object.keys(U).map(function(k){return '<option>'+k+'</option>';}).join('')+'<option>Temperature</option></select>'+
   lab('Value')+'<input class="yt-in" id="uc-v" type="number" value="1" step="any">'+
   '<div class="yt-row"><div>'+lab('From')+'<select class="yt-in" id="uc-f"></select></div><div>'+lab('To')+'<select class="yt-in" id="uc-t"></select></div></div>'+
   btn('Convert','','uc-go')+resBox('uc-r');
  function fill(){
    var c=$('#uc-c',b).value,f=$('#uc-f',b),t=$('#uc-t',b);
    var units=c==='Temperature'?['°C','°F','K']:Object.keys(U[c]);
    f.innerHTML=units.map(function(u){return '<option>'+esc(u)+'</option>';}).join('');
    t.innerHTML=units.map(function(u){return '<option>'+esc(u)+'</option>';}).join('');
    t.selectedIndex=1;
  }
  function toC(v,u){return u==='°C'?v:(u==='°F'?(v-32)*5/9:v-273.15);}
  function fromC(v,u){return u==='°C'?v:(u==='°F'?v*9/5+32:v+273.15);}
  $('#uc-c',b).onchange=fill;fill();
  $('#uc-go',b).onclick=function(){
    var c=$('#uc-c',b).value,v=+$('#uc-v',b).value,f=$('#uc-f',b).value,t=$('#uc-t',b).value,r;
    if(c==='Temperature'){r=fromC(toC(v,f),t);}
    else{r=v*U[c][f]/U[c][t];}
    var rr=(Math.abs(r)<0.0001&&r!==0)?r.toExponential(3):+r.toFixed(6);
    showRes('uc-r','<div class="yt-score" style="font-size:26px;">'+esc(String(rr))+' '+esc(t)+'</div><div class="yt-note">'+esc(String(v))+' '+esc(f)+' = '+esc(String(rr))+' '+esc(t)+'</div>');
  };
}},

{id:'f-calc',cat:'fin',icon:'🧮',name:'Simple Calculator',tag:'Quick everyday calculator',build:function(b){
  b.innerHTML='<input class="yt-in" id="sc-d" readonly style="font-size:26px;text-align:right;background:#f6f6f8;" value="0"><div id="sc-k" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;"></div>'+note('Tip: click the panel and type with your keyboard too.');
  var keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];
  var disp=$('#sc-d',b),kd=$('#sc-k',b),expr='',fresh=true;
  function show(v){disp.value=v;}
  function press(k){
    if(k==='C'){expr='';show('0');fresh=true;return;}
    if(k==='⌫'){expr=expr.slice(0,-1);show(expr||'0');if(!expr)fresh=true;return;}
    if(k==='='){
      var e=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
      if(!/^[0-9+\-*/.() ]+$/.test(e)||!/[0-9]/.test(e)){show('Error');expr='';fresh=true;return;}
      try{var r=Function('"use strict";return ('+e+')')();
        if(typeof r!=='number'||!isFinite(r)){show('Error');expr='';}
        else{var s=String(+r.toFixed(10));show(s);expr=s;}
      }catch(err){show('Error');expr='';}
      fresh=true;return;
    }
    if(k==='±'){
      var e2=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(/^[0-9+\-*/.() ]+$/.test(e2)&&/[0-9]/.test(e2)){try{var r2=Function('"use strict";return ('+e2+')')();if(isFinite(r2)){expr=String(-(+r2.toFixed(10)));show(expr);fresh=true;}}catch(err){}}
      return;
    }
    if(fresh){if(/[0-9.]/.test(k)){expr='';}fresh=false;}
    expr+=k;show(expr);
  }
  keys.forEach(function(k){
    var x=document.createElement('button');
    x.textContent=k;x.className='yt-ghost';x.style.margin='0';x.style.padding='14px 0';x.style.fontSize='17px';
    if(k==='='){x.style.background='#e62117';x.style.color='#fff';}
    else if('÷×−+⌫C%±'.indexOf(k)>=0){x.style.background='#fdeceb';}
    x.onclick=function(){press(k);};
    kd.appendChild(x);
  });
  b.tabIndex=-1;
  b.onkeydown=function(e){
    var m={Enter:'=',Backspace:'⌫',Escape:'C','*':'×','/':'÷','-':'−','+':'+','%':'%','.':'.','(':'(',')':')'};
    var k=m[e.key]!==undefined?m[e.key]:((/^[0-9]$/.test(e.key))?e.key:null);
    if(k){e.preventDefault();press(k);}
  };
  setTimeout(function(){try{b.focus({preventScroll:true});}catch(e){b.focus();}},150);
}},

    $$('#ig-r [data-ig]',b).forEach(function(x){x.onclick=function(){copyTxt(caps[+x.getAttribute('data-ig')]+'\n\n'+tags,x);};});
  };
}}
];
/* init */
renderPills();renderGrid();
})();
</script>
